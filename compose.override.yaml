# Публикация портов на loopback для Nginx Proxy Manager в host-режиме сети.
#
# На боевом VPS NPM работает с network_mode: host и НЕ резолвит имена
# контейнеров docker-сетей — он проксирует на 127.0.0.1:<порт>, как и все
# соседние проекты (8081–8085). VuzFinder занимает следующие свободные:
#   127.0.0.1:8086 -> frontend:3000
#   127.0.0.1:8087 -> api:8000
#
# Порты привязаны ТОЛЬКО к 127.0.0.1 — из интернета недоступны (ТЗ §4.3).
# Файл подхватывается docker compose автоматически.

services:
  frontend:
    ports:
      - "127.0.0.1:8086:3000"
  api:
    ports:
      - "127.0.0.1:8087:8000"
