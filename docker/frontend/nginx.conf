# Nginx внутри frontend-контейнера: отдаёт статику Vite-сборки на :3000.
#
# Это НЕ реверс-прокси VPS (им остаётся Nginx Proxy Manager) — порты 80/443
# контейнер не занимает; NPM проксирует vuzfinder.ru -> university-frontend:3000.

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA-fallback: любые пути отдают index.html (роутинг на клиенте).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Статика с хешем в имени — кэшируется надолго.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
